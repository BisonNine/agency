# Release description for a private release management system.
# It is not needed to build this product.

name:   Agency
module: go.bison9.com/agency
github: BisonNine/agency

version:
  file:    app/app.go
  pattern: 'version\s*=\s*"([^"]+)"'
  format:  '{1}'

go_min:      "1.26"
govulncheck:
  enabled: true
  ignore:
    - id: GO-2026-6911
      reason: github.com/mark3labs/mcp-go has no fixed release yet
      until: 20261231

licenses:
  enabled:  true
  template: license.tmpl
  ignore:   go.bison9.com/agency
  out:      OPEN-SOURCE-LICENSES.txt

build:
  clean_once: true
  command: 'make build PLATFORM={os} ARCH={arch}'
  # No Windows: a dependency does not compile for it.
  targets:
    - darwin/amd64
    - darwin/arm64
    - linux/386
    - linux/amd64
    - linux/arm64

# Must be one of the keys in app/keys.go.
signing:
  minisign:
    enabled:    true
    public_key: RWS4LMzQBg4PUnmdFHlaHFkUt+mm9PLPGvkE812t8Ew4YK5fL8zWqbuN

artifacts:
  - name: claw
    from: 'build/claw-{os}-{arch}'
    macos_bundle_id: com.tenebris.claweh
  - name: claw-auth
    from: 'build/claw-auth-{os}-{arch}'
    macos_bundle_id: com.tenebris.claweh

package:
  extra_files:
    - {from: LICENSE, as: LICENSE.txt}
    - {from: '{staging}/OPEN-SOURCE-LICENSES.txt', as: OPEN-SOURCE-LICENSES.txt}
  per_platform:
    enabled: true
    # CONTRACT: the install script fetches exactly these names.
    asset: 'claw-{os}-{arch}.tar.gz'
  bundle:
    enabled: false
  deb:
    enabled:     true
    # CONTRACT: uploaded to the APT repository and GitHub releases.
    asset:       'agency_{deb_version}_{deb_arch}.deb'
    package:     agency
    maintainer:  'Bison9 <support@bison9.com>'
    description: 'Agency — Personal AI Assistant'
    homepage:    'https://github.com/BisonNine/agency'
    depends:     [ca-certificates]
    targets:
      - linux/amd64
      - linux/arm64
    symlinks:
      - {link: /usr/bin/openclaw, target: claw}
    scripts:     packaging/deb

release:
  tag:   '{version}'
  title: 'v{tag}'
  notes: 'Linux and macOS binaries and Debian/Ubuntu packages (macOS binaries are signed)'
  cloudsmith:
    enabled: true
    repo:    bison9/agency
